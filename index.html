
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>觉醒吧！战神</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08091b;color:#fff;font-family:Arial,"Microsoft YaHei",sans-serif;text-align:center}
.game{max-width:500px;min-height:100vh;margin:auto;padding:16px 18px 25px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#39206c,#111127 65%,#070712)}
h1{font-size:30px;color:#ffe49a;text-shadow:0 0 10px #ff8a26,0 0 30px #ff3d00;margin:12px 0}
.sub{color:#c7c2ed;font-size:13px}
.stats{display:flex;justify-content:space-around;margin:16px 0;padding:12px;background:#ffffff0d;border:1px solid #ffffff20;border-radius:14px}
.stat strong{display:block;color:#ffdb78;font-size:20px;margin-top:4px}
.arena{height:330px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.aura{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#ffb52d55,#9d39ff20,transparent 70%);animation:pulse 1.5s infinite}
.hero{position:relative;font-size:100px;filter:drop-shadow(0 0 16px #ffb52d);transition:.3s;z-index:2}
.hero.awaken{font-size:120px;filter:drop-shadow(0 0 30px #ffe16b);animation:float .6s infinite alternate}
.boss{position:absolute;top:12px;right:15px;font-size:48px;filter:drop-shadow(0 0 12px #ff3535)}
.boss.hit{animation:shake .2s 3}
.lightning{position:absolute;font-size:90px;opacity:0;z-index:3;pointer-events:none}
.lightning.show{animation:flash .7s}
.hp{width:85%;height:14px;border-radius:20px;background:#532c43;overflow:hidden;border:1px solid #ff8e9e;margin:7px}
#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#ff2222,#ffae48);transition:width .3s}
#hptext{font-size:12px;color:#ffc2c2}
#status{min-height:30px;color:#ffdf7e;font-size:18px;font-weight:bold;margin:5px}
.meter{height:18px;background:#302746;border-radius:20px;overflow:hidden;margin:12px 0}
#energy{height:100%;width:0;background:linear-gradient(90deg,#32dfff,#b43cff,#ffe57b);transition:width .08s}
button{border:0;color:white;cursor:pointer;touch-action:manipulation}
#power{width:95%;min-height:75px;border-radius:20px;font-size:20px;font-weight:bold;background:linear-gradient(130deg,#7d24ff,#ec315e,#ff9d22);box-shadow:0 0 22px #a13cff;touch-action:none;user-select:none}
#power:active{transform:scale(.98)}
#restart{margin:14px auto;padding:11px 22px;border-radius:12px;background:#3b3156}
.note{font-size:12px;color:#bbb6d4;line-height:1.8}
@keyframes pulse{50%{transform:scale(1.18);opacity:.65}}
@keyframes float{to{transform:translateY(-9px)}}
@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
@keyframes flash{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(2)}}
</style>
</head>
<body>
<div class="game">
<h1>⚔️ 觉醒吧！战神</h1>
<div class="sub">上古封印破碎 · 战神血脉正在苏醒</div>
<div class="stats">
<div>战力<strong id="powerStat">100</strong></div>
<div>金币<strong id="coins">0</strong></div>
<div>觉醒等级<strong id="level">1</strong></div>
</div>
<div class="arena">
<div class="aura"></div>
<div id="boss" class="boss">👹</div>
<div id="hero" class="hero">🧘</div>
<div id="lightning" class="lightning">⚡</div>
<div id="bossname">深渊魔王</div>
<div class="hp"><div id="hpbar"></div></div>
<div id="hptext">魔王生命：100%</div>
</div>
<div id="status">按住下方按钮，唤醒战神之力！</div>
<div class="meter"><div id="energy"></div></div>
<button id="power">🔥 长按蓄力 · 松手释放大招 🔥</button>
<p class="note">蓄力越久，伤害越高！<br>神力达到 70% 以上可触发雷电大招。</p>
<button id="restart">重新挑战</button>
<p id="result" class="sub"></p>
</div>
<script>
const $=id=>document.getElementById(id);
let hp=100,coins=0,level=1,charging=false,start=0,timer=null,won=false;
const power=$('power');
function begin(e){
 if(e)e.preventDefault();
 if(charging||won)return;
 charging=true;start=Date.now();
 $('status').textContent='🔥 战神血脉正在燃烧！';
 timer=setInterval(()=>{
  const n=Math.min(100,(Date.now()-start)/18);
  $('energy').style.width=n+'%';
  if(n>=100)$('status').textContent='⚡ 神力满载！释放必杀技！';
 },30);
}
function release(e){
 if(e)e.preventDefault();
 if(!charging||won)return;
 charging=false;clearInterval(timer);
 const charge=Math.min(100,(Date.now()-start)/18);
 const damage=Math.max(5,Math.round(charge*(charge>=70?1.25:.65)*level));
 hp=Math.max(0,hp-damage);
 $('energy').style.width='0%';
 $('hero').classList.add('awaken');
 $('hero').textContent=charge>=70?'🦸':'🥷';
 $('boss').classList.add('hit');
 if(charge>=70){
  $('lightning').classList.remove('show');
  void $('lightning').offsetWidth;
  $('lightning').classList.add('show');
  $('status').textContent='🌩️ 战神奥义：九霄神雷！';
 }else $('status').textContent='💥 神力冲击！造成 '+damage+' 点伤害';
 $('hpbar').style.width=hp+'%';
 $('hptext').textContent='魔王生命：'+hp+'%';
 setTimeout(()=>{$('hero').classList.remove('awaken');$('boss').classList.remove('hit')},650);
 if(hp===0){
  won=true;coins+=100*level;
  $('boss').textContent='💀';
  $('status').textContent='🏆 魔王陨落！战神觉醒！';
  $('result').textContent='胜利奖励：+'+(100*level)+' 金币！';
  $('coins').textContent=coins;
  $('power').textContent='挑战成功！';
 }else{
  if(charge>=70)$('result').textContent='雷电大招命中！造成 '+damage+' 点伤害！';
  else $('result').textContent='造成 '+damage+' 点伤害！继续战斗！';
 }
}
power.addEventListener('pointerdown',begin);
power.addEventListener('pointerup',release);
power.addEventListener('pointercancel',release);
power.addEventListener('contextmenu',e=>e.preventDefault());
$('restart').onclick=()=>{
 clearInterval(timer);charging=false;hp=100;won=false;
 $('energy').style.width='0%';$('hpbar').style.width='100%';
 $('hptext').textContent='魔王生命：100%';$('boss').textContent='👹';
 $('hero').textContent='🧘';$('status').textContent='按住下方按钮，唤醒战神之力！';
 $('result').textContent='';$('power').textContent='🔥 长按蓄力 · 松手释放大招 🔥';
 $('lightning').classList.remove('show');
};
</script>
</body>
</html>
